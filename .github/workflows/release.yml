name: release

# Publishes to PyPI (trusted publishing, no stored token), then to the official MCP Registry
# (GitHub OIDC, no stored token). Trigger: push a tag vX.Y.Z that matches pyproject.toml and server.json.
#
# One-time setup the repo owner must do before the first tag:
#   1. PyPI -> Publishing -> "Add a new pending publisher": project design-os-3d-blender,
#      owner jangtrinh, repository design-os-3d-blender, workflow release.yml, environment pypi.
#   2. GitHub -> Settings -> Environments -> create "pypi" (optionally require a reviewer).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Tag matches package and registry versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          reg="$(python3 -c "import json;d=json.load(open('server.json'));print(d['version'], d['packages'][0]['version'])")"
          echo "tag=$tag pyproject=$pkg server.json=$reg"
          test "$tag" = "$pkg"
          test "$reg" = "$pkg $pkg"
      - name: Build
        run: uv build
      - name: twine check
        run: uvx twine check dist/*
      - name: Wheel ships knowledge/ and specs/
        run: |
          unzip -l dist/*.whl | grep -q "_data/knowledge/catalog.json"
          unzip -l dist/*.whl | grep -q "_data/specs/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Login (GitHub OIDC) and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
